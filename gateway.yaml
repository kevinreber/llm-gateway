# Sample gateway config.
#
# Clients ask for an alias (`"model": "smart"`); the gateway resolves it
# to a concrete {provider, model} and forwards that upstream. Changing
# this file shifts traffic without a code change — and from Phase 4, with
# no restart either.
#
# Parsing is strict: an unknown key is a startup error, not a silent
# no-op. A typo here should never quietly disable a rate limit.

aliases:
  fast:  { provider: anthropic, model: claude-haiku-4-5 }
  smart: { provider: anthropic, model: claude-sonnet-5 }
  best:  { provider: anthropic, model: claude-opus-5 }
  code:  { provider: anthropic, model: claude-sonnet-5 }

  # Second-vendor equivalents. These are ordinary aliases — a client can
  # ask for them directly — and they double as the fallback targets
  # below. Keeping them in the same table is the point: a fallback has to
  # name a model, and an alias is the thing that already pairs a model
  # with a provider.
  fast-alt:  { provider: openai, model: gpt-4o-mini }
  smart-alt: { provider: openai, model: gpt-4o }

# Token-bucket policy per alias, enforced across every gateway instance
# via bucketd. `capacity` is the burst ceiling; `refill_rate` is the
# sustained rate in tokens per second.
#
# An alias with no entry here is unlimited. That is deliberate: a missing
# limit should serve traffic rather than fail closed on an omission.
#
# The limit is charged once, against the alias the client named. A
# request that falls back does not also spend a token from the alias it
# fell back to — one request, one token, from the name the caller used.
ratelimits:
  fast:  { capacity: 100, refill_rate: 50 }
  smart: { capacity: 50, refill_rate: 20 }
  best:  { capacity: 10, refill_rate: 2 }

# Circuit breaker, per provider.
#
# Keyed by provider rather than by alias because it tracks the health of
# an upstream: every alias pointing at Anthropic shares one API key, one
# connection pool, and one outage. `failure_threshold` is consecutive
# failures before the breaker opens; `recovery_timeout` is how long it
# stays open before admitting one probe request.
#
# 5xx responses and transport failures count against the threshold. A 429
# does not — a rate-limited provider is a healthy provider telling us to
# slow down, and taking it out of rotation would punish everyone for one
# noisy caller. Neither does most of the 4xx range, which is a refusal of
# the request rather than a failure of the provider. The exceptions are
# 401 and 403, which say the credential is bad and so the provider can
# serve nothing, and 408, which says it was too slow; all three count.
#
# An entry for a provider this build has no key for is ignored, with a
# warning at startup.
breakers:
  anthropic: { failure_threshold: 5, recovery_timeout: 30s }
  openai:    { failure_threshold: 5, recovery_timeout: 30s }

# Fallback chains, per alias.
#
# Entries are aliases, not provider names. A fallback has to specify a
# model as well as a vendor — "fail over from Anthropic to OpenAI" is not
# actionable until someone says which OpenAI model stands in for Sonnet —
# and an alias is exactly that decision, already written down. It also
# means every name here is checked against the alias table at parse time
# rather than discovered to be dead at 3am.
#
# Chains are followed one level deep. The fallbacks of a fallback are
# never consulted, which makes cycles impossible rather than something to
# detect, and caps a request's worst case at the length of one list.
#
# A chain is tried when the primary cannot serve: its breaker is open, it
# returned 5xx or 408 after retries, it could not be reached, or it
# rejected our credential with a 401 or 403. Most 4xx responses are not a
# fallback trigger — a malformed prompt fails the same way everywhere, so
# retrying it down the chain would turn one honest error into four.
#
# Aliases absent from this block have no fallback and fail as before.
fallback:
  best:  [smart, smart-alt]
  smart: [smart-alt, fast]
  code:  [smart-alt]
  fast:  [fast-alt]
